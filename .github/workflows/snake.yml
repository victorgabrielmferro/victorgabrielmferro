name: generate-snake-game

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Generate SVG
        uses: Platane/snk/snk-action@master
        with:
          github_user_name: victorgabrielmferro
          gif_out_path: output/github-contribution-grid-snake.svg
          svg_out_path: output/github-contribution-grid-snake-dark.svg

      - name: Push SVG to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: output
          publish_dir: ./output
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: victorgabrielmferro
          user_email: victorgabrielmferro@gmail.com
          commit_message: "Update snake animation"